# Server port
server.port=9123

# MySQL DB connection (local) - database is created on first run if missing
spring.datasource.url=jdbc:mysql://localhost:3306/Errandbuddy?createDatabaseIfNotExist=true&verifyServerCertificate=false&useSSL=false&requireSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# Hibernate (creates/updates tables from your entities)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Show SQL queries in logs
spring.jpa.show-sql=true


#app.cookie.name=errandgo_token
#app.cookie.secure=${COOKIE_SECURE:false}
#app.cookie.same-site=${COOKIE_SAMESITE:Lax}

# Enable debugging
debug=true
