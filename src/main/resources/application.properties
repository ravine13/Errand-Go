# Server
server.port=9123

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/Errandbuddy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security
app.jwt.secret=${APP_JWT_SECRET}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAMESITE:Strict}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.uploads.dir=${UPLOADS_DIR:C:/errandgo-uploads}

# Errand boy accounts
app.errandboy.email-domain=errandboy.com